# MC Panel stack. The published host port defaults to 3100 and can be
# overridden with MC_PANEL_PORT in .env.
services:
  mc-panel:
    build: .
    image: mc-panel:latest
    container_name: mc-panel
    ports:
      - "${MC_PANEL_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_FILE: /app/data/panel.db
      SERVERS_DIR: /app/servers
      BACKUPS_DIR: /app/backups
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      DOCKER_SOCKET: /var/run/docker.sock
      PANEL_INSTANCE_ID: ${PANEL_INSTANCE_ID:-}
      MC_BIND_IP: ${MC_BIND_IP:-0.0.0.0}
      DEMO_MODE: ${DEMO_MODE:-false}
      SIMULATION_MODE: ${SIMULATION_MODE:-false}
      METRICS_INTERVAL_MS: ${METRICS_INTERVAL_MS:-2000}
      METRICS_RETENTION_HOURS: ${METRICS_RETENTION_HOURS:-48}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
    volumes:
      - panel-data:/app/data        # SQLite DB (servers, metrics history, mods, jobs)
      - panel-servers:/app/servers  # downloaded modpack files
      - panel-backups:/app/backups  # per-server ZIP backups
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    restart: unless-stopped

volumes:
  panel-data:
  panel-servers:
  panel-backups:
